<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Support Android / PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">

    <!-- Support iOS / iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cawdor Builder">
    <link rel="apple-touch-icon" href="icon.png">

    <title>Cawdor Underhive Builder</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="portrait-view">

    <!-- Bandeau supérieur permanent -->
    <div id="top-bar">
        <span id="header-gang-name">Cawdor Builder</span>
        <span id="header-credits-rating">
            Crédits : <span id="ui-credits">1000</span> | Rating : <span id="ui-rating">0</span>
        </span>
    </div>

    <!-- Conteneur principal de l'application -->
    <div id="app-container">
        <div id="main-content"></div>
    </div>

    <!-- Modale / Pop-up universelle -->
    <div id="modal-overlay" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Titre Modale</h3>
            <div id="modal-body"></div>
            <button class="btn-danger" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <!-- Charge d'abord la base de données, puis la logique de l'application -->
    <script src="app.js"></script>
    <script src="game.js"></script>
</body>
</html>
